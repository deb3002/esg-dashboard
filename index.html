<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG Profile</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">

  <header class="header">
    <h1 id="company-name" class="company-name">&nbsp;</h1>
    <p class="subtitle">ESG Profile</p>
    <p class="meta" id="updated-line"></p>
  </header>

  <p id="print-summary" class="print-summary"></p>

  <div class="filter-bar">
    <div class="filter-row">
      <div class="filter-controls">
        <div class="filter-field">
          <label for="theme-select" class="visually-hidden">Filter by theme</label>
          <select id="theme-select">
            <option value="All Themes">All Themes</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="keyword-select" class="visually-hidden">Filter by keyword</label>
          <select id="keyword-select">
            <option value="All Keywords">All Keywords</option>
          </select>
        </div>

        <div class="filter-field search-field">
          <label for="search-input" class="visually-hidden">Search disclosures</label>
          <input type="text" id="search-input" placeholder="Search disclosures&hellip;" autocomplete="off">
          <button type="button" id="clear-search" class="clear-btn" aria-label="Clear search" hidden>&times;</button>
        </div>
      </div>

      <div class="export-actions">
        <button type="button" id="download-csv-btn" class="secondary-btn">Download CSV</button>
        <button type="button" id="print-btn" class="secondary-btn">Print / PDF</button>
      </div>
    </div>

    <p id="visible-count" class="visible-count" aria-live="polite"></p>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col" class="col-subfactor">Sub Factor</th>
          <th scope="col" class="col-keywords">Keywords</th>
          <th scope="col" class="col-documents">Documents</th>
          <th scope="col" class="col-highlights">Highlights</th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
    </table>

    <div id="empty-state" class="empty-state" hidden>
      <p>No disclosures match your filters.</p>
      <button type="button" id="clear-filters-btn" class="text-btn">Clear filters</button>
    </div>
  </div>

  <footer class="footer">
    <p>Demo &mdash; data shown is illustrative.</p>
  </footer>

</div>

<script src="data/disclosures.js"></script>
<script src="app.js"></script>
</body>
</html>
